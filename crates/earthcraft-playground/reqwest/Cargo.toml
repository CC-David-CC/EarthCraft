# Playground's browser build of EarthCraft (patches/google-earth.yaml in github.com/daijro/openplayground): the part of
# reqwest crates/earthcraft-data uses, adapted for imagery through the WebOS host. Native builds compile it empty.
[package]
name = "earthcraft-playground-reqwest"
version = "0.1.0"
edition = "2024"
description = "EarthCraft browser imagery client backed by the WebOS host"
license = "MIT"
publish = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false }
bytes = "1"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", default-features = false, features = ["sync"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
